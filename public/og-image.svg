<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#31104b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern -->
  <g opacity="0.15">
    <circle cx="150" cy="150" r="300" fill="#6366f1" filter="blur(80px)" />
    <circle cx="1050" cy="480" r="350" fill="#ec4899" filter="blur(100px)" />
  </g>

  <!-- Main Card Container -->
  <rect x="80" y="60" width="1040" height="510" rx="32" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" />

  <!-- Badge -->
  <g transform="translate(140, 110)">
    <rect width="360" height="42" rx="21" fill="#4f46e5" fill-opacity="0.3" stroke="#818cf8" stroke-width="1" />
    <text x="180" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#c7d2fe" text-anchor="middle" letter-spacing="1">
      ✨ 80+ ESTILOS UNICODE (COPIAR Y PEGAR)
    </text>
  </g>

  <!-- Main Title -->
  <text x="140" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
    Conversor de Letras Bonitas
  </text>
  <text x="140" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Fuentes &amp; Nicks para Redes Sociales
  </text>

  <!-- Subtitle / Platforms -->
  <text x="140" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Instagram • Free Fire • TikTok • WhatsApp • Facebook • Cursivas • Góticas
  </text>

  <!-- Visual Examples Display -->
  <g transform="translate(140, 390)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="280" height="110" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="24" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8">CURSIVA ELEGANTE</text>
    <text x="24" y="80" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">𝓛𝓮𝓽𝓻𝓪𝓼 𝓑𝓸𝓷𝓲𝓽𝓪𝓼</text>

    <!-- Box 2 -->
    <rect x="310" y="0" width="280" height="110" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="334" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8">GÓTICA FRAKTUR</text>
    <text x="334" y="80" font-family="sans-serif" font-size="24" font-weight="700" fill="#ffffff">𝕷𝖊𝖙𝖗𝖆𝖘 𝕭𝖔𝖓𝖎𝖙𝖆𝖘</text>

    <!-- Box 3 -->
    <rect x="620" y="0" width="300" height="110" rx="18" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.1" />
    <text x="644" y="38" font-family="sans-serif" font-size="13" font-weight="700" fill="#94a3b8">NICK CON ALAS GAMER</text>
    <text x="644" y="80" font-family="sans-serif" font-size="22" font-weight="700" fill="#ffffff">꧁༺ 𝕷𝖊𝖙𝖗𝖆𝖘 ༻꧂</text>
  </g>

  <!-- URL Brand Footer -->
  <text x="1060" y="530" font-family="sans-serif" font-size="16" font-weight="700" fill="#818cf8" text-anchor="end">
    conversordeletrasbonitas.net
  </text>
</svg>
