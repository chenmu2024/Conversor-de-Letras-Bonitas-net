<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="faviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="60%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    
    <!-- Gold/Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Letter Gradient -->
    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    
    <!-- Subtle Inner Shadow / Highlight -->
    <linearGradient id="overlayHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Rounded Base -->
  <rect width="512" height="512" rx="128" fill="url(#faviconBg)" />
  <rect width="512" height="512" rx="128" fill="url(#overlayHighlight)" />
  
  <!-- Subtle Border Stroke -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="12" />

  <!-- Main Calligraphic 'L' / Aesthetic Letter Typography -->
  <g transform="translate(256, 275)" text-anchor="middle">
    <!-- Stylized 'L' or Font '𝓣' / 'L' -->
    <text 
      x="-30" 
      y="55" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Outfit', 'Georgia', serif" 
      font-size="280" 
      font-weight="900" 
      fill="url(#letterGrad)"
      filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.35))"
    >L</text>
    
    <!-- Script 'b' for 'Letras Bonitas' -->
    <text 
      x="80" 
      y="70" 
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Georgia', serif" 
      font-size="220" 
      font-weight="800" 
      font-style="italic"
      fill="#a5b4fc"
      filter="drop-shadow(0px 6px 12px rgba(0,0,0,0.3))"
    >b</text>
  </g>

  <!-- Sparkle Icon Top Right -->
  <path d="M400 90 L415 135 L460 150 L415 165 L400 210 L385 165 L340 150 L385 135 Z" fill="url(#sparkleGrad)" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.3))" />
  <path d="M120 370 L128 395 L153 403 L128 411 L120 436 L112 411 L87 403 L112 395 Z" fill="url(#sparkleGrad)" opacity="0.9" />

  <!-- Active Emerald Online Indicator Dot -->
  <circle cx="430" cy="430" r="32" fill="#10b981" stroke="#ffffff" stroke-width="10" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.25))" />
</svg>
